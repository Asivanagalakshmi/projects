services:
  postgres:
    image: postgres:16
    container_name: credential_verification_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: credential_verification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - credential_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credential_verification"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  credential_pgdata:
